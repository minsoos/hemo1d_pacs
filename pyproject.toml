[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "ninja"]
build-backend = "scikit_build_core.build"
 
[project]
name = "hemo1d"
version = "0.1.0"
requires-python = ">=3.8"
description = "1D hemodynamics discontinuous Galerkin solver with Python bindings"
 
[tool.scikit-build]
cmake.define = { HEMO1D_BUILD_TESTS = "OFF", HEMO1D_BUILD_PYTHON = "ON" }
wheel.install-dir = "."